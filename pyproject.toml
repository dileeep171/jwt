[project]
name = "secureapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NallavalliDharma", email = "nallavallidharma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
]

[project.scripts]
secureapi = "secureapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
[tool.vercel]
entrypoint = "src.secureapi.main:app"